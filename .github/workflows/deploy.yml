name: Deploy seismo & EWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /www/wwwroot/seism-app
          git fetch origin main
          git reset --hard origin/main
          source venv/bin/activate
          pip install -r requirements.txt
          deactivate
          venv/bin/python -m py_compile server.py main.py
          sudo /usr/bin/systemctl restart seism-2 seism-ews
          sleep 8
          /usr/bin/systemctl is-active seism-2
          /usr/bin/systemctl is-active seism-ews
