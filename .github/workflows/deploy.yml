name: Deploy seismo & EWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /www/wwwroot/seism-app
          git fetch origin main
          git reset --hard origin/main
          source venv/bin/activate
          pip install -r requirements.txt
          deactivate
          sudo systemctl restart seism-2 seism-ews
          systemctl is-active seism-2
          systemctl is-active seism-ews
